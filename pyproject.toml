[project]
name = "goodfeeling"
version = "0.1.0"
description = "Sometimes I Get a Good Feeling: beat-synced highlight edits from raw FPV footage."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.14",
    "fastapi>=0.120",
    "librosa>=1.0",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "pillow>=11.0",
    "pydantic>=2.10",
    "scenedetect>=0.6.4",
    "soundfile>=0.12",
    "typer>=0.15",
    "uvicorn>=0.38",
]

[project.scripts]
goodfeeling = "goodfeeling.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/goodfeeling"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls the real Claude API; runs only when ANTHROPIC_API_KEY is set",
    "slow: renders or analyses real-length media",
]
